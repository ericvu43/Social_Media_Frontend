<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid #e1e8ed;
        }

        .contacts {
            width: 30%;
            border-right: 1px solid #e1e8ed;
            overflow-y: auto;
            background: #fff;
        }

        .contact-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .contact {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer;
        }

        .contact:hover {
            background: #f5f8fa;
        }

        .contact.active {
            background: #e8f0fe;
        }

        .messages {
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        .message-header {
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            background: #fff;
        }

        .message-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fff;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }

        .sent {
            background: #1da1f2;
            color: white;
            margin-left: auto;
        }

        .received {
            background: #e1e8ed;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #e1e8ed;
            background: #fff;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccd6dd;
            border-radius: 20px;
            outline: none;
        }

        .send-btn {
            padding: 10px 20px;
            background: #1da1f2;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #1991da;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="contacts">
            <ul class="contact-list" id="contactList">
                <li class="contact" data-user="user1">User 1</li>
                <li class="contact" data-user="user2">User 2</li>
                <li class="contact" data-user="user3">User 3</li>
            </ul>
        </div>
        <div class="messages">
            <div class="message-header" id="currentChat">Select a conversation</div>
            <div class="message-area" id="messageArea"></div>
            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Type a message...">
                <button class="send-btn" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        const contacts = document.querySelectorAll('.contact');
        const messageArea = document.getElementById('messageArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const currentChat = document.getElementById('currentChat');

        let activeContact = null;
        const conversations = {
            user1: [],
            user2: [],
            user3: []
        };

        contacts.forEach(contact => {
            contact.addEventListener('click', () => {
                contacts.forEach(c => c.classList.remove('active'));
                contact.classList.add('active');
                activeContact = contact.dataset.user;
                currentChat.textContent = contact.textContent;
                loadMessages();
            });
        });

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            if (!activeContact || !messageInput.value.trim()) return;

            const message = {
                text: messageInput.value,
                sender: 'me',
                time: new Date().toLocaleTimeString()
            };

            conversations[activeContact].push(message);
            messageInput.value = '';
            loadMessages();

            // Simulate a reply after 1 second
            setTimeout(() => {
                conversations[activeContact].push({
                    text: 'This is an automated reply!',
                    sender: 'them',
                    time: new Date().toLocaleTimeString()
                });
                loadMessages();
            }, 1000);
        }

        function loadMessages() {
            if (!activeContact) return;
            messageArea.innerHTML = '';
            conversations[activeContact].forEach(msg => {
                const div = document.createElement('div');
                div.classList.add('message', msg.sender === 'me' ? 'sent' : 'received');
                div.textContent = msg.text;
                messageArea.appendChild(div);
            });
            messageArea.scrollTop = messageArea.scrollHeight;
        }
    </script>
</body>
</html>
